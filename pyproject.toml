[project]
name = "agentjam"
version = "0.1.0"
description = "Local-first orchestrator for AI coding agents. You stay in control."
authors = [
    { name = "Jamie Fraser", email = "jamiedf8@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15",
    "rich>=13.0",
    "textual>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.0",
    "pyyaml>=6.0",
    "cryptography>=44.0",
    "argon2-cffi>=23.0",
    "pydantic>=2.0",
    "strands-agents>=0.1",
    "strands-agents-tools>=0.1",
    "strands-agents-sops>=0.1",
    "strands-shell>=0.1",
    "openai>=2.44.0",
    "litellm>=1.91.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.0",
]

[project.scripts]
agentjam = "agentjam.cli.main:app"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
