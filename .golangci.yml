run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck      # unchecked errors
    - goimports     # import grouping
    - gosimple      # simplifications
    - govet         # standard go vet
    - ineffassign   # unused assignments
    - staticcheck   # static analysis
    - unused        # unused identifiers
    - misspell      # spelling
    - bodyclose     # http body close
    - contextcheck  # ctx propagation
    - nilerr        # returning nil after error
    - nilnil        # == nil comparison
    - prealloc      # slice preallocation

linters-settings:
  goimports:
    local-prefixes: github.com/harness/harness
  misspell:
    locale: US

issues:
  exclude-rules:
    # Test files can use a different style.
    - path: _test\.go
      linters:
        - errcheck
        - gosimple
        - ineffassign

  # Maximum issues to report.
  max-issues-per-linter: 50
  max-same-issues: 5